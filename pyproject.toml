[project]
name = "mcp-server-toolkit"
version = "0.1.0"
description = "Shared utilities for building MCP science servers following the spectra-mcp-server pattern: science stays plain Python, the MCP wrapper only publishes it."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "nesar-ai-assistant" }]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
server = ["fastmcp>=0.4", "tomli>=2.0; python_version < '3.11'"]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10"]

[project.urls]
Homepage = "https://github.com/nesar-ai-assistant/mcp-server-toolkit"
Issues = "https://github.com/nesar-ai-assistant/mcp-server-toolkit/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server_toolkit"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
